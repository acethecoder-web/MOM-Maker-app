<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoM Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef1f7;
        --surface: #ffffff;
        --ink: #14203a;
        --muted: #5b6785;
        --line: #d8deea;
        --accent: #3d5afe;
        --accent-ink: #ffffff;
        --accent-soft: #e6eaff;
        --out-bg: #101a30;
        --out-ink: #d9e2ff;
        --danger: #c62828;
        --shadow:
          0 1px 2px rgba(20, 32, 58, 0.06),
          0 12px 32px -12px rgba(20, 32, 58, 0.18);
        --font-display:
          "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1220;
          --surface: #141c30;
          --ink: #e8edfb;
          --muted: #9aa6c4;
          --line: #26324f;
          --accent: #6f86ff;
          --accent-ink: #0c1220;
          --accent-soft: #1d2748;
          --out-bg: #0a0f1c;
          --out-ink: #cfd9fb;
          --danger: #ff8a80;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
        }
      }

      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.55;
        padding: clamp(1.25rem, 5vw, 4rem) 1rem;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 1.75rem;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(2rem, 6vw, 3.1rem);
        line-height: 1.05;
        letter-spacing: -0.025em;
        margin: 0 0 0.6rem;
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 52ch;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: clamp(1.1rem, 3vw, 1.75rem);
      }

      .field + .field {
        margin-top: 1.4rem;
      }
      .field-label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .hint {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.92rem;
      }

      /* File drop area */
      .drop {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.1rem 1.25rem;
        border: 1.5px dashed var(--line);
        border-radius: 14px;
        background: var(--bg);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .drop:hover,
      .drop.is-over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .drop:focus-within {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .drop input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .drop-icon {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
      }
      .drop-text strong {
        display: block;
      }
      .drop-text span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .drop.has-file {
        border-style: solid;
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 1.4rem 0;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.85rem 1rem;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      textarea::placeholder {
        color: var(--muted);
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .actions {
        margin-top: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.12s,
          filter 0.15s,
          background 0.15s;
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      #go {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 0.8rem 1.4rem;
        font-size: 1rem;
      }
      #go:hover {
        filter: brightness(1.08);
      }
      #go:active {
        transform: translateY(1px);
      }
      #go:disabled {
        opacity: 0.7;
        cursor: progress;
      }

      #clear {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
      }
      #clear:hover {
        background: var(--accent-soft);
        color: var(--ink);
      }
      #clear:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      #go.loading .spinner {
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Result */
      .result {
        margin-top: 1.5rem;
        display: none;
      }
      .result.show {
        display: block;
      }
      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.6rem;
      }
      .result-head h2 {
        font-family: var(--font-display);
        font-size: 1.25rem;
        margin: 0;
        letter-spacing: -0.01em;
      }
      #copy {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
        padding: 0.4rem 0.85rem;
        font-size: 0.9rem;
      }
      #copy:hover {
        background: var(--accent-soft);
      }
      #output.status {
        color: var(--muted);
      }
      #output.error {
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 14px;
        padding: 1rem 1.25rem;
      }

      .minutes {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.1rem 1.25rem;
      }
      .minutes h3 {
        font-family: var(--font-display);
        font-size: 1.05rem;
        letter-spacing: -0.01em;
        margin: 1.2rem 0 0.4rem;
      }
      .minutes h3:first-child {
        margin-top: 0;
      }
      .minutes p {
        margin: 0;
      }
      .minutes ul {
        margin: 0;
        padding-left: 1.2rem;
      }
      .minutes li + li {
        margin-top: 0.25rem;
      }
      .muted {
        color: var(--muted);
      }

      .table-wrap {
        overflow-x: auto;
      }
      .minutes table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      .minutes th,
      .minutes td {
        text-align: left;
        vertical-align: top;
        padding: 0.6rem 0.75rem;

        border-bottom: 1px solid var(--line);
      }
      .minutes th {
        font-size: 0.85rem;
        color: var(--muted);
        background: var(--surface);
      }
      .minutes tr:last-child td {
        border-bottom: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation-duration: 1.5s !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Transcript to Minutes of the meeting, generated from your notes</h1>
        <p>
          Upload a Word document or paste a transcript. You'll get structured
          minutes back in seconds.
        </p>
      </header>

      <section class="panel">
        <div class="field">
          <span class="field-label">Upload a .docx file</span>
          <label class="drop" id="drop">
            <input type="file" id="file" accept=".docx" />
            <span class="drop-icon" aria-hidden="true">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 16V4" />
                <path d="m7 9 5-5 5 5" />
                <path d="M5 20h14" />
              </svg>
            </span>
            <span class="drop-text">
              <strong id="file-name">Choose a file or drop it here</strong>
              <span id="file-meta">Word documents only (.docx)</span>
            </span>
          </label>
        </div>

        <div class="divider">or</div>

        <div class="field">
          <label class="field-label" for="transcript"
            >Paste a transcript
            <span class="hint">(used when no file is chosen)</span></label
          >
          <textarea
            id="transcript"
            placeholder="Paste the meeting transcript here"
          ></textarea>
        </div>

        <div class="actions">
          <button id="go" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span id="go-label">Generate minutes</span>
          </button>
          <button id="clear" type="button">Clear</button>
        </div>

        <div class="result" id="result" aria-live="polite">
          <div class="result-head">
            <h2>Minutes</h2>
            <button id="copy" type="button">Copy</button>
          </div>
          <div id="output"></div>
        </div>
      </section>
    </main>

    <script>
      const fileInput = document.getElementById("file");
      const drop = document.getElementById("drop");
      const fileName = document.getElementById("file-name");
      const fileMeta = document.getElementById("file-meta");
      const goBtn = document.getElementById("go");
      const goLabel = document.getElementById("go-label");
      const result = document.getElementById("result");
      const out = document.getElementById("output");

      function showFile() {
        const f = fileInput.files[0];
        if (f) {
          fileName.textContent = f.name;
          fileMeta.textContent =
            (f.size / 1024).toFixed(0) + " KB. Select again to replace.";
          drop.classList.add("has-file");
        } else {
          fileName.textContent = "Choose a file or drop it here";
          fileMeta.textContent = "Word documents only (.docx)";
          drop.classList.remove("has-file");
        }
      }
      fileInput.addEventListener("change", showFile);

      ["dragenter", "dragover"].forEach((ev) =>
        drop.addEventListener(ev, (e) => {
          e.preventDefault();
          drop.classList.add("is-over");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        drop.addEventListener(ev, () => drop.classList.remove("is-over")),
      );
      let lastMinutes = null;

      function el(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function show(text, isError) {
        lastMinutes = null;
        result.classList.add("show");
        out.className = isError ? "error" : "status";
        out.textContent = text;
      }

      function listSection(title, items) {
        const wrap = el("div");
        wrap.appendChild(el("h3", title));
        if (!items || items.length === 0) {
          wrap.appendChild(el("p", "None mentioned.", "muted"));
          return wrap;
        }
        const ul = el("ul");
        items.forEach((t) => ul.appendChild(el("li", t)));
        wrap.appendChild(ul);
        return wrap;
      }

      function actionTable(items) {
        const wrap = el("div");
        wrap.appendChild(el("h3", "Action items"));

        if (!items || items.length === 0) {
          wrap.appendChild(el("p", "None mentioned.", "muted"));
          return wrap;
        }

        const scroll = el("div", undefined, "table-wrap");
        const table = el("table");

        const headRow = el("tr");
        ["Task", "Responsible", "Due date"].forEach((h) =>
          headRow.appendChild(el("th", h)),
        );
        const thead = el("thead");
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = el("tbody");
        items.forEach((a) => {
          const row = el("tr");
          row.appendChild(el("td", a.task || "-"));
          row.appendChild(el("td", a.owner ?? "Unassigned"));
          row.appendChild(el("td", a.due ?? "Not set"));
          tbody.appendChild(row);
        });
        table.appendChild(tbody);

        scroll.appendChild(table);
        wrap.appendChild(scroll);
        return wrap;
      }

      function renderMinutes(data) {
        lastMinutes = data;
        result.classList.add("show");

        out.className = "";
        out.textContent = "";

        const box = el("div", undefined, "minutes");

        const summary = el("div");
        summary.appendChild(el("h3", "Summary"));
        summary.appendChild(el("p", data.summary || "No summary."));
        box.appendChild(summary);

        box.appendChild(
          listSection("Discussion points", data.discussion_points),
        );
        box.appendChild(listSection("Decisions", data.decisions));
        box.appendChild(actionTable(data.action_items));

        out.appendChild(box);
      }

      function toPlainText(d) {
        const bullets = (arr) =>
          arr && arr.length
            ? arr.map((x) => "- " + x).join("\n")
            : "None mentioned.";
        const actions =
          d.action_items && d.action_items.length
            ? d.action_items
                .map(
                  (a) =>
                    `- ${a.task} (Responsible: ${a.owner ?? "Unassigned"}, Due: ${a.due ?? "Not set"})`,
                )
                .join("\n")
            : "None mentioned.";
        return [
          "Summary\n" + (d.summary || "No summary."),
          "Discussion points\n" + bullets(d.discussion_points),
          "Decisions\n" + bullets(d.decisions),
          "Action items\n" + actions,
        ].join("\n\n");
      }

      document.getElementById("copy").addEventListener("click", async (e) => {
        if (!lastMinutes) return;
        try {
          await navigator.clipboard.writeText(toPlainText(lastMinutes));
          e.target.textContent = "Copied";
          setTimeout(() => (e.target.textContent = "Copy"), 1500);
        } catch {
          e.target.textContent = "Copy failed";
        }
      });

      const clearBtn = document.getElementById("clear");
      clearBtn.addEventListener("click", () => {
        fileInput.value = "";
        document.getElementById("transcript").value = "";
        showFile();
        result.classList.remove("show");
        out.className = "";
        out.textContent = "";
        lastMinutes = null;
      });

      goBtn.addEventListener("click", async () => {
        const file = fileInput.files[0];
        const transcript = document.getElementById("transcript").value.trim();

        if (!file && !transcript) {
          show("Add a .docx file or paste a transcript first.", true);
          return;
        }

        goBtn.disabled = true;
        clearBtn.disabled = true;
        goBtn.classList.add("loading");
        goLabel.textContent = "Generating";
        show("Generating...");

        try {
          let res;
          if (file) {
            const form = new FormData();
            form.append("file", file);
            res = await fetch("/minutes-file", { method: "POST", body: form });
          } else {
            res = await fetch("/minutes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ transcript }),
            });
          }
          const data = await res.json();
          if (!res.ok) {
            show(data.error || "Something went wrong.", true);
            return;
          }
          renderMinutes(data);
        } catch (e) {
          show("Error: " + e.message, true);
        } finally {
          goBtn.disabled = false;
          clearBtn.disabled = false;
          goBtn.classList.remove("loading");
          goLabel.textContent = "Generate minutes";
        }
      });
    </script>
  </body>
</html>
